name: Daily GitHub Contribution

on:
  schedule:
    - cron: "10 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update activity log
        run: |
          git config user.name "ShaikMuzzammil"
          git config user.email "muzzammil160806@gmail.com"

          echo "$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')" >> daily_contributions.txt

          git add daily_contributions.txt
          git commit -m "chore: update activity log"
          git push origin main
