name: Daily Commit

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false
      
      - name: Create daily contribution
        run: |
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - Daily contribution" >> daily_contributions.txt
          git config user.name "ShaikMuzzammil"
          git config user.email "muzzammil160806@gmail.com"
          git add daily_contributions.txt
          git commit -m "📅 Daily auto-commit - $(date -u '+%Y-%m-%d')" || echo "No changes to commit"
      
      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
