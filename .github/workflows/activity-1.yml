name: Environment Sync

on:
  schedule:
    # 1:30 AM IST = 8:00 PM UTC (previous day)
    - cron: "0 20 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync environment updates
        run: |
          git config user.name "ShaikMuzzammil"
          git config user.email "muzzammil160806@gmail.com"

          echo "$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')" >> activity_log_1.txt

          git add activity_log_1.txt
          git commit -m "refactor: sync environment updates"
          git push origin main