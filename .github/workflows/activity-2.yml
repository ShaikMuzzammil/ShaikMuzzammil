name: Local Setup and Documentation Update

on:
  schedule:
    # 6:40 PM IST = 1:10 PM UTC
    - cron: "10 13 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update local setup and docs
        run: |
          git config user.name "ShaikMuzzammil"
          git config user.email "muzzammil160806@gmail.com"

          echo "$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')" >> activity_log_2.txt

          git add activity_log_2.txt
          git commit -m "chore: update local setup and docs"
          git push origin main